<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Anniversary 4y5m ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Kanit",sans-serif;
}

body{
    background:linear-gradient(135deg,#ffd6e7,#ffeef5);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    overflow:hidden;
}

.card{
    width:420px;
    background:white;
    border-radius:25px;
    padding:35px;
    text-align:center;
    box-shadow:0 15px 40px rgba(0,0,0,.15);
    z-index:10;
}

h1{
    color:#ff4f8b;
    margin-bottom:15px;
}

p{
    color:#555;
    font-size:18px;
    line-height:1.8;
}

button{
    margin-top:25px;
    padding:14px 35px;
    border:none;
    border-radius:30px;
    background:#ff4f8b;
    color:white;
    font-size:18px;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    transform:scale(1.08);
    background:#ff2f75;
}

#love{
    margin-top:20px;
    font-size:22px;
    color:#ff4f8b;
    font-weight:bold;
}

.heart{
    position:absolute;
    color:#ff4f8b;
    animation:float 8s linear infinite;
}

@keyframes float{
    from{
        transform:translateY(100vh) scale(0.5);
        opacity:0;
    }
    20%{
        opacity:1;
    }
    to{
        transform:translateY(-120px) scale(1.5);
        opacity:0;
    }
}
</style>

</head>
<body>

<div class="card">
    <h1>💖 Happy Anniversary 4y5m นะงับไอดื้อ💖</h1>

    <p>
        ไอดื้อของเค๊าา ❤️<br><br>

        ขอบคุณที่เข้ามาเป็นความสุขในทุก ๆ วัน<br>
        ขอบคุณที่คอยอยู่เคียงข้างกันเสมอ<br>
        ไม่ว่าจะผ่านไปกี่วัน กี่เดือน หรือกี่ปี<br>
        เค้าก็จะรักเธอเหมือนเดิมนะงับแบร่ๆ 💕
    </p>

    <button onclick="showLove()">กดตรงนี้สิ(กดเยอะๆเลยย) 😊</button>

    <div id="love"></div>
</div>

<script>

const messages=[
"❤️ รักเธอที่สุด ❤️",
"🥰 อยู่ด้วยกันไปนานๆนะ",
"🌸 ขอบคุณที่เป็นแฟนที่น่ารัก",
"💖 เค้าจะดูแลเธอให้ดีที่สุด",
"🌹 Happy Anniversary นะคนเก่งของเค้า",
"💍 ขอให้ทุกปีมีแต่เรานะงับ"
];

function showLove(){
    let random=Math.floor(Math.random()*messages.length);
    document.getElementById("love").innerHTML=messages[random];
}

function createHeart(){

    const heart=document.createElement("div");

    heart.classList.add("heart");

    heart.innerHTML="❤";

    heart.style.left=Math.random()*100+"vw";

    heart.style.fontSize=(20+Math.random()*30)+"px";

    heart.style.animationDuration=(4+Math.random()*5)+"s";

    document.body.appendChild(heart);

    setTimeout(()=>{
        heart.remove();
    },9000);
}

setInterval(createHeart,250);

</script>

</body>
</html>
